name: Deploy Xiuxian Game to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify and extract V2.1 game
        run: |
          cat github-pages-v21.zip.part01 github-pages-v21.zip.part02 github-pages-v21.zip.part03 github-pages-v21.zip.part04 > /tmp/xiuxian-v21.zip
          echo "5e98e29fc2112eb4058cc4021e27072ce6c0276b6a28a06f3d8ad68c99f22b49  /tmp/xiuxian-v21.zip" | sha256sum --check --strict
          mkdir -p site
          unzip -q /tmp/xiuxian-v21.zip -d site
          test -f site/index.html
          test -f site/v2-1-events.js
          test -f site/v2-1-core.js
      - name: Apply verified open-choice patch 9006f25
        run: |
          echo "2b08a292eac139041196ebd14a9556639671e5f91f1b064d068900e02033904d  index.html" | sha256sum --check --strict
          echo "b46a0d35c16abb72d498a7dfea1760a7153856b7efeff8ce4bcdaaa1d82a6dca  v2-game.js" | sha256sum --check --strict
          cp index.html site/index.html
          cp v2-game.js site/v2-game.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
